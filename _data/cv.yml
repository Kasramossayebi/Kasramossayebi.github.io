    Research Experience:
      - company: Northeastern University / IAIFI
        position: Algebraic K-Theory for Resources
        location: Boston, United States
        start_date: 2026-06
        end_date: present
        highlights:
          - Applied Waldhausen's S-construction to quantum-resource categories to seek computable spectra and invariants.
          - Explored Segal and May delooping machines and applications to quantum magic.
          - Preprint in preparation.

      - company: Northeastern University / IAIFI
        position: A-infinity Algebras and Entanglement
        start_date: 2026-03
        end_date: present
        highlights:
          - Extended the entanglement DGA to an A-infinity algebra via homotopy transfer.
          - Established local-unitary invariance and extracted basis-independent invariants from higher Massey products.
          - Preprint in preparation.

      - company: With Christian Ferko
        position: Extending Generative Effects to Entanglement
        start_date: 2024-12
        end_date: present
        highlights:
          - Explored categorical, operator-algebraic, and higher-descent approaches to detecting entangled states.

      - company: With Christian Ferko, Eashan Iyer, and Gregor Sanfey
        position: A Hodge Theory for Entanglement Cohomology
        start_date: 2024-07
        end_date: 2025-01
        highlights:
          - Developed a Hodge-theoretic framework for entanglement cohomology and proved compatibility of support operators.
          - Published in Physical Review A.

      - company: Independent project
        position: Homotopical Equivalence of Categories
        start_date: 2023-03
        end_date: 2023-07
        highlights:
          - Studied conditions for adjoint equivalences of relative categories to extend to homotopical equivalences.

    Publications:
